services:

  # ─────────────────── Infrastructure ───────────────────

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kuronami}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuronami}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secret}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────── Migrator (one-shot) ───────────────────

  migrator:
    build:
      context: ./src/migrator
      dockerfile: Dockerfile.migrator
    container_name: migrator
    restart: on-failure
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
#  
  # ─────────────────── App services ───────────────────

  frontend:
    build:
      context: .
      dockerfile: ./src/frontend/Dockerfile.frontend
    container_name: frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  anime:
    build:
      context: .
      dockerfile: ./src/anime_service/Dockerfile.anime
    container_name: anime
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  auth:
    build:
      context: ./src/user_defined
      dockerfile: Dockerfile.auth
    container_name: auth
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  recommendation:
    build:
      context: .
      dockerfile: ./src/recommendation_service/Dockerfile.recommendation
    container_name: recommendation
    restart: unless-stopped
    env_file: .env
    volumes:
      - lancedb_data:/app/src/recommendation_service/lancedb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ─────────────────── Caddy (reverse proxy) ───────────────────

  caddy:
    build:
      context: .
      dockerfile: ./src/caddy/Dockerfile.caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./src/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - anime
      - auth
      - recommendation
    networks:
      - internal
      - external

  # ─────────────────── Tooling ───────────────────

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - internal
      - external
    ports:
      - "127.0.0.1:8080:8080"

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - internal
      - external
    ports:
      - "127.0.0.1:5540:5540"

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - external
    ports:
      - "127.0.0.1:9000:9000"

# ─────────────────── Volumes ───────────────────

volumes:
  postgres_data:
  redis_data:
  lancedb_data:
  caddy_data:
  caddy_config:
  portainer_data:

# ─────────────────── Networks ───────────────────

networks:
  internal:
  external:
