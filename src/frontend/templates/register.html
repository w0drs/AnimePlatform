{% extends "base.html" %}

{% block title %}Регистрация — Kuronami{% endblock %}

{% block extra_head %}
<style>
.login-wrap {
    min-height: calc(100vh - 140px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

.login-card {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border-radius: 28px;
    border: 1px solid var(--border-light);
    box-shadow: var(--shadow-lg);
    padding: 2.5rem 2.5rem 2rem;
    width: 100%;
    max-width: 420px;
    animation: cardIn 0.35s ease;
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}

.login-logo {
    text-align: center;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 0.3rem;
    letter-spacing: -0.5px;
}

.login-logo span {
    color: var(--accent-darker);
}

.login-subtitle {
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 2rem;
}

.login-fields {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.login-field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
}

.login-field label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.login-field input {
    padding: 0.8rem 1rem;
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--bg-gray-light);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    outline: none;
}

.login-field input:focus {
    border-color: var(--accent-darker);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: #fff;
}

.login-field input.invalid {
    border-color: #dc2626;
    box-shadow: 0 0 0 3px #fee2e2;
}

.field-hint {
    font-size: 0.75rem;
    color: var(--text-light);
}

.field-error {
    font-size: 0.75rem;
    color: #dc2626;
    display: none;
}

.login-submit {
    width: 100%;
    padding: 0.85rem;
    border-radius: 40px;
    border: none;
    background: var(--gradient);
    color: var(--text-primary);
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.2px;
}

.login-submit:hover {
    background: var(--accent-darker);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
}

.login-submit:active {
    transform: translateY(0);
}

.login-footer {
    text-align: center;
    margin-top: 1.25rem;
    font-size: 0.88rem;
    color: var(--text-muted);
}

.login-footer a {
    color: var(--accent-darker);
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s;
}

.login-footer a:hover {
    color: var(--accent-dark);
}

.login-error {
    background: #fee2e2;
    border: 1px solid #fecaca;
    color: #dc2626;
    border-radius: 12px;
    padding: 0.7rem 1rem;
    font-size: 0.88rem;
    margin-bottom: 1rem;
    text-align: center;
}

.login-divider {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin: 1.25rem 0;
    color: var(--text-light);
    font-size: 0.8rem;
}

.login-divider::before,
.login-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
}
</style>
{% endblock %}

{% block content %}
<div class="login-wrap">
    <div class="login-card">

        <div class="login-logo">Kuro<span>nami</span></div>
        <div class="login-subtitle">Создайте аккаунт</div>

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('register_post') }}" id="register-form">
            <div class="login-fields">

                <div class="login-field">
                    <label for="login">Логин</label>
                    <input type="text" id="login" name="login"
                           placeholder="username"
                           value="{{ form.login or '' }}"
                           autocomplete="username" required>
                    <span class="field-error" id="error-login"></span>
                </div>

                <div class="login-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="your@email.com"
                           value="{{ form.email or '' }}"
                           autocomplete="email" required>
                    <span class="field-error" id="error-email"></span>
                </div>

                <div class="login-field">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password"
                           placeholder="••••••••"
                           autocomplete="new-password" required>
                    <span class="field-hint">Минимум 8 символов</span>
                    <span class="field-error" id="error-password"></span>
                </div>

                <div class="login-field">
                    <label for="confirm-password">Подтверждение пароля</label>
                    <input type="password" id="confirm-password" name="confirm_password"
                           placeholder="••••••••"
                           autocomplete="new-password" required>
                    <span class="field-error" id="error-confirm"></span>
                </div>

            </div>

            <button type="submit" class="login-submit">Зарегистрироваться</button>
        </form>

        <div class="login-divider">или</div>

        <div class="login-footer">
            Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
        </div>

    </div>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', function(e) {
    let valid = true;

    const login = document.getElementById('login');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm-password');

    // Сброс
    [login, email, password, confirm].forEach(el => {
        el.classList.remove('invalid');
    });
    document.querySelectorAll('.field-error').forEach(el => {
        el.style.display = 'none';
        el.textContent = '';
    });

    function showError(inputEl, errorId, msg) {
        inputEl.classList.add('invalid');
        const err = document.getElementById(errorId);
        err.textContent = msg;
        err.style.display = 'block';
        valid = false;
    }

    if (login.value.trim().length < 3) {
        showError(login, 'error-login', 'Логин должен быть не менее 3 символов');
    }

    if (!email.value.includes('@')) {
        showError(email, 'error-email', 'Введите корректный email');
    }

    if (password.value.length < 8) {
        showError(password, 'error-password', 'Пароль должен быть не менее 8 символов');
    }

    if (password.value !== confirm.value) {
        showError(confirm, 'error-confirm', 'Пароли не совпадают');
    }

    if (!valid) e.preventDefault();
});
</script>
{% endblock %}
